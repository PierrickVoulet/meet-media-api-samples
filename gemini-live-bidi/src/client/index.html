<!DOCTYPE html>
<meta charset="utf-8">
<title>Gemini Live Bidi</title>

<head>
</head>

<body>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="bundle.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
  
    #text-reply {
      display: none;
      /* Hidden initially */
      flex: 1;
      /* Take remaining height */
      overflow-y: auto;
      /* Scroll internally */
      white-space: pre-wrap;
      font-family: sans-serif;
      padding: 20px;
      box-sizing: border-box;
      font-size: 16px;
      line-height: 1.5;
      width: 100%; /* Ensure full width */
      text-align: center; /* Center text if desired, or keep left */
    }
  
    #start-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      /* Changed from height: 100% to share space */
    }
  </style>
  <script>document.body.onload = () => { initializeSession() }</script>
  
  <div id="start-container">
    <button id="start-btn"
      onclick="document.getElementById('start-container').style.display='none'; document.getElementById('text-reply').style.display='block'; handleUserStart()"
      style="padding: 12px 24px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; background-color: #1a73e8; color: white;">Call
      Gemini</button>
  </div>
  
  <audio id="audio-1" autoplay></audio>
  <div id="text-reply"></div>
  
  <div style="text-align: center; margin-top: 10px; padding-bottom: 10px;">
    <label style="font-family: sans-serif; font-size: 14px;">
      <input type="checkbox" id="debug-delay-checkbox"> Debug: Enable 1s Delay
    </label>
  </div>
</body>

</html>
