<!DOCTYPE html>
<meta charset="utf-8">
<title>Gemini Live Bidi</title>

<head>
</head>

<body>
  <script src="https://accounts.google.com/gsi/client" async>
  </script>
  <script src="bundle.js"></script>
  <script>document.body.onload = () => { initializeSession() }</script>
  <div style="display: flex; justify-content: center; align-items: center; min-height: 50vh;">
    <button id="start-btn" onclick="this.style.display='none'; handleUserStart()"
      style="padding: 12px 24px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; background-color: #1a73e8; color: white;">Call
      Gemini</button>
  </div>
  <audio id="audio-1" autoplay></audio>
  <div id="text-reply"
    style="white-space: pre-wrap; font-family: sans-serif; margin-top: 10px; border: 1px solid #ccc; padding: 10px; min-height: 50px;">
  </div>
</body>

</html>
