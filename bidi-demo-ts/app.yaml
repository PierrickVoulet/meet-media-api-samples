runtime: nodejs20

handlers:
- url: /.*
  secure: always
  redirect_http_response_code: 301
  script: auto
instance_class: F1
automatic_scaling:
  min_idle_instances: 0
  max_idle_instances: 1
  min_pending_latency: 3000ms
  max_pending_latency: automatic

env_variables:
  GOOGLE_API_KEY: ""
  DEMO_AGENT_MODEL: "gemini-2.5-flash-native-audio-preview-12-2025"
